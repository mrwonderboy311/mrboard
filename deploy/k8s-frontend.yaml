apiVersion: apps/v1
kind: Deployment
metadata:
  name: xkube-frontend
  namespace: xkube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: xkube-frontend
  template:
    metadata:
      labels:
        app: xkube-frontend
    spec:
      containers:
        - name: nginx
          image: xkube-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: xkube-frontend
  namespace: xkube
spec:
  selector:
    app: xkube-frontend
  ports:
    - port: 80
      targetPort: 80

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: xkube-frontend
  namespace: xkube
spec:
  ingressClassName: nginx
  rules:
    - host: xkube.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: xkube-frontend
                port:
                  number: 80
