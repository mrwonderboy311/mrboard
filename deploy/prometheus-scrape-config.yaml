# Static Prometheus scrape configuration
# Add this to your prometheus.yml under scrape_configs:
scrape_configs:
  - job_name: 'xkube'
    metrics_path: /metrics
    static_configs:
      - targets: ['xkube-backend.mrboard.svc.cluster.local:8080']
        labels:
          app: xkube
          env: production
    scrape_interval: 30s
    scrape_timeout: 10s
